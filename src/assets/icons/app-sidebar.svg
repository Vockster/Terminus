<?xml version="1.0" encoding="UTF-8"?>
<!-- Terminus original artwork, supplied by the project owner. Sidebar and
     small-size copy of the identity mark, kept as its own file so its framing
     can be tuned for 16/32px without changing how app.svg renders in Settings.
     The drawing is identical to app.svg. The drawing is unchanged. The only
     edits are the removal of the opaque black backing plate, terminal wing
     gradient stops set to transparent so the same silhouette works on light and
     dark browser chrome, and a viewBox cropped to the drawn content, taking the bottom of the
     wings where the gradients have already faded to fully transparent so the
     mark fills more of a square icon box. -->
